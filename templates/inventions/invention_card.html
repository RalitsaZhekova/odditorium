<article class="collection-card invention-card">
    {% if invention.image %}
        <img
            class="invention-image"
            src="{{ invention.image.url }}"
            alt="{{ invention.name }}"
            loading="lazy"
        >
    {% else %}
        <div class="invention-image invention-image-placeholder">
            <span>Illustration pending</span>
        </div>
    {% endif %}

    <h2>
        <a href="{% url 'inventions:invention-detail' invention.pk %}">
            {{ invention.name }}
        </a>
    </h2>
    <p>{{ invention.description|truncatewords:30 }}</p>
    <p>Invented by {{ invention.inventor }}</p>

    <p class="collection-meta">
        Absurdity: {{ invention.absurdity_level }}/5
        &middot;
        Collection:
        <a href="{% url 'galleries:collection-detail' invention.collection.pk %}">
            {{ invention.collection.name }}
        </a>
    </p>
</article>
