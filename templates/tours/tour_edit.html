{% extends 'base.html' %}

{% block title %}Edit {{ tour.name }} | Odditorium{% endblock %}

{% block content %}
    <p class="eyebrow">Adjust the itinerary</p>
    <h1>Edit tour</h1>

    <form method="post" class="museum-form">
        {% csrf_token %}
        {% include 'partials/form_fields.html' %}

        <div class="form-actions">
            <button type="submit" class="button">Save changes</button>
            <a href="{% url 'tours:tour-detail' tour.pk %}">
                Cancel
            </a>
        </div>
    </form>
{% endblock %}
